name: Deploy Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, zip, pdo_mysql, gd, intl
          coverage: none
          tools: composer:v2

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: /api
          VITE_SCHOOL_SLUG: nurul-hikmah

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare frontend staging (keep backend/ on server)
        run: |
          mkdir -p /tmp/frontend-deploy
          cp -a frontend/dist/. /tmp/frontend-deploy/
          cp deploy/public_html.htaccess /tmp/frontend-deploy/.htaccess

      - name: Prepare backend staging (exclude storage + .env)
        run: |
          mkdir -p /tmp/backend-deploy
          rsync -a \
            --exclude='storage/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='tests/' \
            --exclude='.phpunit.result.cache' \
            --exclude='.phpunit.cache' \
            backend/ /tmp/backend-deploy/
          cp deploy/backend.htaccess /tmp/backend-deploy/.htaccess
          cp deploy/post-deploy.sh /tmp/backend-deploy/post-deploy.sh
          chmod +x /tmp/backend-deploy/post-deploy.sh
          # Keep empty storage skeleton so first deploy can create dirs without wiping server storage
          mkdir -p \
            /tmp/backend-deploy/storage/app/public \
            /tmp/backend-deploy/storage/framework/{cache,sessions,views} \
            /tmp/backend-deploy/storage/logs
          touch /tmp/backend-deploy/storage/app/.gitignore \
            /tmp/backend-deploy/storage/app/public/.gitignore \
            /tmp/backend-deploy/storage/logs/.gitignore

      - name: Verify deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY; do
            eval "val=\${$name}"
            if [ -z "$val" ]; then
              echo "Missing repository secret: $name"
              missing=1
            else
              echo "OK: $name is set"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Add secrets at: Settings → Secrets and variables → Actions"
            echo "Required: DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH, DEPLOY_SSH_KEY"
            echo "Optional: DEPLOY_PORT (default 65002), DEPLOY_PHP"
            exit 1
          fi

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configure SSH known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          PORT="${DEPLOY_PORT:-65002}"
          HOST="$(echo -n "${DEPLOY_HOST}" | tr -d '[:space:]')"
          HOST="${HOST#ssh://}"

          if [ -z "${HOST}" ]; then
            echo "DEPLOY_HOST secret is empty"
            exit 1
          fi

          echo "SSH target host_len=${#HOST} port=${PORT}"

          # Optional: paste output of `ssh-keyscan -p PORT HOST` as secret DEPLOY_KNOWN_HOSTS
          if [ -n "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" >> ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
            echo "Loaded DEPLOY_KNOWN_HOSTS secret into known_hosts."
            echo "SSH_STRICT=yes" >> "$GITHUB_ENV"
            exit 0
          fi

          # Hostinger / some hosts block ssh-keyscan from GitHub Actions IPs.
          # Prefer keyscan when it works; otherwise accept-new on first connect.
          TMP_KEYS="$(mktemp)"
          ok=0
          for attempt in 1 2 3; do
            if ssh-keyscan -p "${PORT}" -T 10 "${HOST}" >"${TMP_KEYS}" 2>/tmp/ssh-keyscan.err; then
              if [ -s "${TMP_KEYS}" ]; then
                ok=1
                break
              fi
            fi
            echo "ssh-keyscan attempt ${attempt}/3 failed (stderr below):"
            cat /tmp/ssh-keyscan.err || true
            # Quick TCP probe for clearer diagnostics (does not fail the job)
            timeout 5 bash -c "echo >/dev/tcp/${HOST}/${PORT}" 2>/tmp/tcp.err \
              && echo "TCP ${HOST}:${PORT} is reachable" \
              || echo "TCP ${HOST}:${PORT} not reachable: $(cat /tmp/tcp.err 2>/dev/null || true)"
            sleep 2
          done

          if [ "${ok}" -eq 1 ]; then
            cat "${TMP_KEYS}" >> ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
            echo "known_hosts updated via ssh-keyscan ($(wc -l < "${TMP_KEYS}") line(s))."
            echo "SSH_STRICT=yes" >> "$GITHUB_ENV"
          else
            echo "ssh-keyscan unavailable from this runner — using StrictHostKeyChecking=accept-new"
            echo "Tip: set secret DEPLOY_KNOWN_HOSTS from local: ssh-keyscan -p ${PORT} YOUR_HOST"
            echo "SSH_STRICT=accept-new" >> "$GITHUB_ENV"
          fi

      - name: Rsync frontend → public_html (do not delete backend/)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          PORT="${DEPLOY_PORT:-65002}"
          HOST="$(echo -n "${DEPLOY_HOST}" | tr -d '[:space:]')"
          STRICT="${SSH_STRICT:-accept-new}"
          rsync -az --delete \
            --exclude='backend/' \
            -e "ssh -p ${PORT} -o StrictHostKeyChecking=${STRICT} -o UserKnownHostsFile=${HOME}/.ssh/known_hosts" \
            /tmp/frontend-deploy/ \
            "${DEPLOY_USER}@${HOST}:${DEPLOY_PATH}/"

      - name: Rsync backend → public_html/backend (preserve remote storage + .env)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          PORT="${DEPLOY_PORT:-65002}"
          HOST="$(echo -n "${DEPLOY_HOST}" | tr -d '[:space:]')"
          STRICT="${SSH_STRICT:-accept-new}"
          rsync -az --delete \
            --filter='P storage/' \
            --filter='P storage/***' \
            --filter='P .env' \
            --exclude='storage/' \
            --exclude='.env' \
            --exclude='.env.*' \
            -e "ssh -p ${PORT} -o StrictHostKeyChecking=${STRICT} -o UserKnownHostsFile=${HOME}/.ssh/known_hosts" \
            /tmp/backend-deploy/ \
            "${DEPLOY_USER}@${HOST}:${DEPLOY_PATH}/backend/"

      - name: Post-deploy (backup DB + migrate only)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PHP: ${{ secrets.DEPLOY_PHP }}
        run: |
          PORT="${DEPLOY_PORT:-65002}"
          HOST="$(echo -n "${DEPLOY_HOST}" | tr -d '[:space:]')"
          PHP_BIN="${DEPLOY_PHP:-php}"
          STRICT="${SSH_STRICT:-accept-new}"
          ssh -p "${PORT}" -o StrictHostKeyChecking="${STRICT}" -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "${DEPLOY_USER}@${HOST}" \
            "cd '${DEPLOY_PATH}/backend' && DEPLOY_PHP='${PHP_BIN}' bash ./post-deploy.sh"
