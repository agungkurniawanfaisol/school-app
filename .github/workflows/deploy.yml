name: Deploy Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, zip, pdo_mysql, gd, intl
          coverage: none
          tools: composer:v2

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Read package version
        id: pkg_version
        working-directory: frontend
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "git_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: /api
          VITE_SCHOOL_SLUG: nurul-hikmah
          VITE_APP_VERSION: ${{ steps.pkg_version.outputs.version }}
          VITE_GIT_SHA: ${{ steps.pkg_version.outputs.git_sha }}

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare frontend staging (keep backend/ on server)
        run: |
          mkdir -p /tmp/frontend-deploy
          cp -a frontend/dist/. /tmp/frontend-deploy/
          cp deploy/public_html.htaccess /tmp/frontend-deploy/.htaccess

      - name: Prepare backend staging (exclude storage + .env)
        run: |
          mkdir -p /tmp/backend-deploy
          rsync -a \
            --exclude='storage/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='tests/' \
            --exclude='.phpunit.result.cache' \
            --exclude='.phpunit.cache' \
            backend/ /tmp/backend-deploy/
          cp deploy/backend.htaccess /tmp/backend-deploy/.htaccess
          cp deploy/post-deploy.sh /tmp/backend-deploy/post-deploy.sh
          chmod +x /tmp/backend-deploy/post-deploy.sh
          # Keep empty storage skeleton so first deploy can create dirs without wiping server storage
          mkdir -p \
            /tmp/backend-deploy/storage/app/public \
            /tmp/backend-deploy/storage/framework/{cache,sessions,views} \
            /tmp/backend-deploy/storage/logs
          touch /tmp/backend-deploy/storage/app/.gitignore \
            /tmp/backend-deploy/storage/app/public/.gitignore \
            /tmp/backend-deploy/storage/logs/.gitignore

      - name: Verify deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY; do
            eval "val=\${$name}"
            if [ -z "$val" ]; then
              echo "Missing repository secret: $name"
              missing=1
            else
              echo "OK: $name is set"
            fi
          done
          PORT="${DEPLOY_PORT:-65002}"
          echo "OK: DEPLOY_PORT effective=${PORT}"
          if [ "${PORT}" = "22" ]; then
            echo "WARNING: Port 22 usually fails on Hostinger shared hosting. Prefer 65002."
          fi
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Add secrets at: Settings → Secrets and variables → Actions"
            echo "Required: DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH, DEPLOY_SSH_KEY"
            echo "Optional: DEPLOY_PORT (default 65002), DEPLOY_PHP, DEPLOY_KNOWN_HOSTS"
            exit 1
          fi

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configure SSH known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          PORT="${DEPLOY_PORT:-65002}"
          HOST="$(echo -n "${DEPLOY_HOST}" | tr -d '[:space:]')"
          HOST="${HOST#ssh://}"
          HOST="${HOST%%/*}"
          # Strip accidental user@ or :port from host secret
          HOST="${HOST##*@}"
          HOST="${HOST%%:*}"

          if [ -z "${HOST}" ]; then
            echo "DEPLOY_HOST secret is empty"
            exit 1
          fi

          echo "SSH target host_len=${#HOST} port=${PORT}"

          # Optional: paste output of `ssh-keyscan -p PORT HOST` as secret DEPLOY_KNOWN_HOSTS
          if [ -n "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" >> ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
            echo "Loaded DEPLOY_KNOWN_HOSTS secret into known_hosts."
            echo "SSH_STRICT=yes" >> "$GITHUB_ENV"
          else
            # Hostinger / some hosts block ssh-keyscan from GitHub Actions IPs.
            TMP_KEYS="$(mktemp)"
            ok=0
            for attempt in 1 2 3; do
              if ssh-keyscan -p "${PORT}" -T 10 "${HOST}" >"${TMP_KEYS}" 2>/tmp/ssh-keyscan.err; then
                if [ -s "${TMP_KEYS}" ]; then
                  ok=1
                  break
                fi
              fi
              echo "ssh-keyscan attempt ${attempt}/3 failed (stderr below):"
              cat /tmp/ssh-keyscan.err || true
              sleep 2
            done

            if [ "${ok}" -eq 1 ]; then
              cat "${TMP_KEYS}" >> ~/.ssh/known_hosts
              chmod 600 ~/.ssh/known_hosts
              echo "known_hosts updated via ssh-keyscan ($(wc -l < "${TMP_KEYS}") line(s))."
              echo "SSH_STRICT=yes" >> "$GITHUB_ENV"
            else
              echo "ssh-keyscan unavailable from this runner — using StrictHostKeyChecking=accept-new"
              echo "Tip: set secret DEPLOY_KNOWN_HOSTS from local: ssh-keyscan -p ${PORT} YOUR_HOST"
              echo "SSH_STRICT=accept-new" >> "$GITHUB_ENV"
            fi
          fi

          echo "DEPLOY_SSH_PORT=${PORT}" >> "$GITHUB_ENV"
          echo "DEPLOY_SSH_HOST=${HOST}" >> "$GITHUB_ENV"

      - name: Preflight SSH connectivity
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_SSH_PORT:-65002}"
          HOST="${DEPLOY_SSH_HOST:?missing DEPLOY_SSH_HOST}"
          STRICT="${SSH_STRICT:-accept-new}"
          SSH_BASE=(
            ssh -p "${PORT}"
            -o StrictHostKeyChecking="${STRICT}"
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts"
            -o ConnectTimeout=30
            -o ConnectionAttempts=3
            -o ServerAliveInterval=15
          )

          echo "Probing TCP port ${PORT}..."
          tcp_ok=0
          for attempt in 1 2 3 4 5; do
            if timeout 20 bash -c "echo >/dev/tcp/${HOST}/${PORT}" 2>/tmp/tcp.err; then
              echo "TCP reachable (attempt ${attempt}/5)."
              tcp_ok=1
              break
            fi
            echo "TCP attempt ${attempt}/5 failed: $(cat /tmp/tcp.err 2>/dev/null || true)"
            sleep $((attempt * 3))
          done

          if [ "${tcp_ok}" -ne 1 ]; then
            echo ""
            echo "ERROR: Cannot open TCP to Hostinger SSH (port ${PORT})."
            echo "GitHub Actions cannot reach the server — rsync will also time out."
            echo ""
            echo "Checklist:"
            echo "  1. hPanel → Advanced → SSH Access → Enable SSH"
            echo "  2. DEPLOY_PORT must be 65002 for Hostinger shared (not 22)"
            echo "  3. DEPLOY_HOST must be the SSH IP from hPanel (prefer IP over domain)"
            echo "  4. From your laptop verify: ssh -p ${PORT} ${DEPLOY_USER}@YOUR_HOST"
            echo "  5. If laptop works but Actions times out, Hostinger may block GHA IPs — open a Hostinger ticket"
            exit 1
          fi

          echo "Probing SSH auth..."
          ssh_ok=0
          for attempt in 1 2 3; do
            if "${SSH_BASE[@]}" "${DEPLOY_USER}@${HOST}" "echo deploy-ok" 2>/tmp/ssh.err; then
              echo "SSH auth OK (attempt ${attempt}/3)."
              ssh_ok=1
              break
            fi
            echo "SSH attempt ${attempt}/3 failed:"
            cat /tmp/ssh.err || true
            sleep $((attempt * 4))
          done

          if [ "${ssh_ok}" -ne 1 ]; then
            echo ""
            echo "ERROR: TCP works but SSH auth/session failed."
            echo "Check DEPLOY_USER + DEPLOY_SSH_KEY (public key must be in Hostinger authorized_keys)."
            exit 1
          fi

      - name: Rsync frontend → public_html (do not delete backend/)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_SSH_PORT:-65002}"
          HOST="${DEPLOY_SSH_HOST:?missing DEPLOY_SSH_HOST}"
          STRICT="${SSH_STRICT:-accept-new}"
          SSH_E="ssh -p ${PORT} -o StrictHostKeyChecking=${STRICT} -o UserKnownHostsFile=${HOME}/.ssh/known_hosts -o ConnectTimeout=30 -o ConnectionAttempts=3 -o ServerAliveInterval=15"

          for attempt in 1 2 3; do
            if rsync -az --delete --timeout=120 \
              --exclude='backend/' \
              -e "${SSH_E}" \
              /tmp/frontend-deploy/ \
              "${DEPLOY_USER}@${HOST}:${DEPLOY_PATH}/"; then
              echo "Frontend rsync OK (attempt ${attempt}/3)."
              exit 0
            fi
            echo "Frontend rsync attempt ${attempt}/3 failed; retrying..."
            sleep $((attempt * 5))
          done
          echo "Frontend rsync failed after 3 attempts."
          exit 1

      - name: Rsync backend → public_html/backend (preserve remote storage + .env)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_SSH_PORT:-65002}"
          HOST="${DEPLOY_SSH_HOST:?missing DEPLOY_SSH_HOST}"
          STRICT="${SSH_STRICT:-accept-new}"
          SSH_E="ssh -p ${PORT} -o StrictHostKeyChecking=${STRICT} -o UserKnownHostsFile=${HOME}/.ssh/known_hosts -o ConnectTimeout=30 -o ConnectionAttempts=3 -o ServerAliveInterval=15"

          for attempt in 1 2 3; do
            if rsync -az --delete --timeout=120 \
              --filter='P storage/' \
              --filter='P storage/***' \
              --filter='P .env' \
              --exclude='storage/' \
              --exclude='.env' \
              --exclude='.env.*' \
              -e "${SSH_E}" \
              /tmp/backend-deploy/ \
              "${DEPLOY_USER}@${HOST}:${DEPLOY_PATH}/backend/"; then
              echo "Backend rsync OK (attempt ${attempt}/3)."
              exit 0
            fi
            echo "Backend rsync attempt ${attempt}/3 failed; retrying..."
            sleep $((attempt * 5))
          done
          echo "Backend rsync failed after 3 attempts."
          exit 1

      - name: Post-deploy (backup DB + migrate only)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PHP: ${{ secrets.DEPLOY_PHP }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_SSH_PORT:-65002}"
          HOST="${DEPLOY_SSH_HOST:?missing DEPLOY_SSH_HOST}"
          PHP_BIN="${DEPLOY_PHP:-php}"
          STRICT="${SSH_STRICT:-accept-new}"

          for attempt in 1 2 3; do
            if ssh -p "${PORT}" \
              -o StrictHostKeyChecking="${STRICT}" \
              -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
              -o ConnectTimeout=30 \
              -o ConnectionAttempts=3 \
              -o ServerAliveInterval=15 \
              "${DEPLOY_USER}@${HOST}" \
              "cd '${DEPLOY_PATH}/backend' && DEPLOY_PHP='${PHP_BIN}' bash ./post-deploy.sh"; then
              echo "Post-deploy OK (attempt ${attempt}/3)."
              exit 0
            fi
            echo "Post-deploy attempt ${attempt}/3 failed; retrying..."
            sleep $((attempt * 5))
          done
          echo "Post-deploy failed after 3 attempts."
          exit 1
