name: Deploy Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, zip, pdo_mysql, gd, intl
          coverage: none
          tools: composer:v2

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: /api
          VITE_SCHOOL_SLUG: nurul-hikmah

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare frontend staging (keep backend/ on server)
        run: |
          mkdir -p /tmp/frontend-deploy
          cp -a frontend/dist/. /tmp/frontend-deploy/
          cp deploy/public_html.htaccess /tmp/frontend-deploy/.htaccess

      - name: Prepare backend staging (exclude storage + .env)
        run: |
          mkdir -p /tmp/backend-deploy
          rsync -a \
            --exclude='storage/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='tests/' \
            --exclude='.phpunit.result.cache' \
            --exclude='.phpunit.cache' \
            backend/ /tmp/backend-deploy/
          cp deploy/backend.htaccess /tmp/backend-deploy/.htaccess
          # Keep empty storage skeleton so first deploy can create dirs without wiping server storage
          mkdir -p \
            /tmp/backend-deploy/storage/app/public \
            /tmp/backend-deploy/storage/framework/{cache,sessions,views} \
            /tmp/backend-deploy/storage/logs
          touch /tmp/backend-deploy/storage/app/.gitignore \
            /tmp/backend-deploy/storage/app/public/.gitignore \
            /tmp/backend-deploy/storage/logs/.gitignore

      - name: Verify deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY; do
            eval "val=\${$name}"
            if [ -z "$val" ]; then
              echo "Missing repository secret: $name"
              missing=1
            else
              echo "OK: $name is set"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Add secrets at: Settings → Secrets and variables → Actions"
            echo "Required: DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH, DEPLOY_SSH_KEY"
            echo "Optional: DEPLOY_PORT (default 65002), DEPLOY_PHP"
            exit 1
          fi

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add host to known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '65002' }}
        run: |
          mkdir -p ~/.ssh
          # Hostinger shared hosting SSH port is usually 65002 (not 22)
          ssh-keyscan -p "${DEPLOY_PORT}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Rsync frontend → public_html (do not delete backend/)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '65002' }}
        run: |
          rsync -az --delete \
            --exclude='backend/' \
            -e "ssh -p ${DEPLOY_PORT}" \
            /tmp/frontend-deploy/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Rsync backend → public_html/backend (preserve remote storage + .env)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '65002' }}
        run: |
          # --filter protect remote storage and .env from --delete
          rsync -az --delete \
            --filter='P storage/' \
            --filter='P storage/***' \
            --filter='P .env' \
            --exclude='storage/' \
            --exclude='.env' \
            --exclude='.env.*' \
            -e "ssh -p ${DEPLOY_PORT}" \
            /tmp/backend-deploy/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/backend/"

      - name: Post-deploy Artisan
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '65002' }}
          DEPLOY_PHP: ${{ secrets.DEPLOY_PHP || 'php' }}
        run: |
          ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<EOF
          set -euo pipefail
          cd "${DEPLOY_PATH}/backend"
          mkdir -p storage/app/public storage/framework/{cache,sessions,views} storage/logs bootstrap/cache
          chmod -R ug+rwx storage bootstrap/cache || true
          if [ ! -f .env ]; then
            echo "WARNING: backend/.env missing — skip artisan. Create .env on server once."
            exit 0
          fi
          ${DEPLOY_PHP} artisan storage:link --force || true
          if [ ! -d storage/app/public ]; then
            echo "ERROR: storage/app/public missing after deploy"
            exit 1
          fi
          if [ ! -w storage/app/public ]; then
            echo "ERROR: storage/app/public is not writable by web user"
            exit 1
          fi
          mkdir -p storage/app/public/uploads
          ${DEPLOY_PHP} artisan migrate --force --no-interaction
          ${DEPLOY_PHP} artisan config:cache
          ${DEPLOY_PHP} artisan route:cache
          ${DEPLOY_PHP} artisan view:cache
          EOF
